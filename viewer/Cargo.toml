[package]
name = "axolotl-viewer"
version = "0.1.0"
edition = "2021"
description = "Axolotl 图库只读查看器（macOS）"

[lib]
name = "axolotl_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图引擎：同仓库 path 依赖，直接 link Rust crate（无 HTTP 层）
axolotl-rs = { path = "../prototype-rust" }

[profile.release]
codegen-units = 1
lto = true
strip = true
