name: Build multi-platform wheels

# Produces installable axolotl_rs wheels for every platform the skill supports.
# Artifacts are uploaded on every build; on a manual run set create_release=true
# AND provide release_tag (e.g. wheels-v0.1.0) to publish a GitHub Release.
# Runner labels verified 2026-11-09: macos-13 retired, macOS 14 images retired
# 2026-11-02, so Intel builds use macos-15-intel and arm64 uses macos-15.
# pyo3 is built with abi3-py310: ONE wheel per platform covers Python 3.10+.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish all wheels to a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for the release (only used when create_release is true)'
        type: string
        default: ''
  push:
    branches: [dev, main, 'ci/**']
    paths:
      - 'prototype-rust/**'
      - '.github/workflows/wheels.yml'
  pull_request:
    paths:
      - 'prototype-rust/**'
      - '.github/workflows/wheels.yml'

permissions:
  contents: write

jobs:
  # Fast gate: prove the CPU-only path compiles without any Metal dependency.
  # This is the exact check that non-macOS users need to pass.
  cpu-check:
    name: CPU-only compile check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype-rust
      - name: cargo check --lib (no Metal)
        working-directory: prototype-rust
        run: cargo check --features python-bindings --lib

  wheels:
    name: ${{ matrix.platform.name }}
    needs: cpu-check
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'Linux x86_64',   os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  manylinux: 'auto' }
          - { name: 'Linux aarch64',  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: 'auto' }
          - { name: 'macOS arm64',    os: macos-15,         target: aarch64-apple-darwin,      manylinux: '' }
          - { name: 'macOS x86_64',   os: macos-15-intel,   target: x86_64-apple-darwin,       manylinux: '' }
          - { name: 'Windows x86_64', os: windows-latest,   target: x86_64-pc-windows-msvc,   manylinux: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features python-bindings
          working-directory: prototype-rust
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Smoke test (install wheel + import)
        shell: bash
        working-directory: prototype-rust
        run: |
          python -m pip install --no-index --find-links dist axolotl_rs
          python -c "import axolotl_rs; print('axolotl_rs OK:', axolotl_rs.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: prototype-rust/dist/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -lh dist/*.whl
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.whl
          generate_release_notes: true
