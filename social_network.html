<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axolotl 图数据库 - 社交网络可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        #cy {
            width: 100%;
            height: 600px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>🦄 Axolotl 图数据库 - 社交网络可视化</h1>
    
    <div id="cy"></div>
    
    <div class="info">
        <h3>📊 图统计信息</h3>
        <ul>
            <li><strong>顶点数：</strong> 10</li>
            <li><strong>边数：</strong> 20</li>
            <li><strong>社区数：</strong> 1 （所有顶点都在同一个社区中）</li>
            <li><strong>图类型：</strong> 无向图</li>
        </ul>
        
        <h3>🏷️ 职业图例</h3>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FF6B6B;"></div>
                <span>Data Scientist</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4ECDC4;"></div>
                <span>Software Engineer</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #45B7D1;"></div>
                <span>Product Manager</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #F7DC6F;"></div>
                <span>DevOps Engineer</span>
            </div>
        </div>
        
        <h3>💡 使用提示</h3>
        <ul>
            <li>鼠标滚轮：缩放</li>
            <li>拖拽空白区域：平移</li>
            <li>拖拽顶点：移动位置</li>
            <li>点击顶点：查看详细信息</li>
        </ul>
    </div>
    
    <script>
        // 图数据
        const graphData = {
            nodes: [
                { id: '0', label: 'Alice', job: 'Data Scientist', age: 28, community: 0 },
                { id: '1', label: 'Bob', job: 'Software Engineer', age: 32, community: 0 },
                { id: '2', label: 'Charlie', job: 'Product Manager', age: 30, community: 0 },
                { id: '3', label: 'Diana', job: 'Data Scientist', age: 27, community: 0 },
                { id: '4', label: 'Eve', job: 'Software Engineer', age: 29, community: 0 },
                { id: '5', label: 'Frank', job: 'DevOps Engineer', age: 35, community: 0 },
                { id: '6', label: 'Grace', job: 'Data Scientist', age: 31, community: 0 },
                { id: '7', label: 'Henry', job: 'Software Engineer', age: 26, community: 0 },
                { id: '8', label: 'Ivy', job: 'Product Manager', age: 33, community: 0 },
                { id: '9', label: 'Jack', job: 'DevOps Engineer', age: 34, community: 0 }
            ],
            edges: [
                { source: '0', target: '1', weight: 0.9 },
                { source: '0', target: '2', weight: 0.8 },
                { source: '0', target: '3', weight: 0.95 },
                { source: '1', target: '2', weight: 0.7 },
                { source: '1', target: '4', weight: 0.85 },
                { source: '2', target: '8', weight: 0.9 },
                { source: '3', target: '6', weight: 0.9 },
                { source: '4', target: '7', weight: 0.8 },
                { source: '5', target: '9', weight: 0.9 },
                { source: '5', target: '1', weight: 0.6 },
                { source: '6', target: '0', weight: 0.9 },
                { source: '7', target: '9', weight: 0.7 },
                { source: '8', target: '0', weight: 0.75 }
            ]
        };
        
        // 职业到颜色的映射
        const jobColors = {
            'Data Scientist': '#FF6B6B',
            'Software Engineer': '#4ECDC4',
            'Product Manager': '#45B7D1',
            'DevOps Engineer': '#F7DC6F'
        };
        
        // 准备 Cytoscape 元素
        const elements = [];
        
        // 添加顶点
        graphData.nodes.forEach(node => {
            elements.push({
                data: {
                    id: node.id,
                    label: node.label,
                    job: node.job,
                    age: node.age,
                    community: node.community,
                    color: jobColors[node.job]
                }
            });
        });
        
        // 添加边
        graphData.edges.forEach(edge => {
            elements.push({
                data: {
                    id: `${edge.source}-${edge.target}`,
                    source: edge.source,
                    target: edge.target,
                    weight: edge.weight
                }
            });
        });
        
        // 初始化 Cytoscape
        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: elements,
            style: [
                {
                    selector: 'node',
                    style: {
                        'label': 'data(label)',
                        'background-color': 'data(color)',
                        'width': 60,
                        'height': 60,
                        'font-size': 14,
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'color': '#333',
                        'text-outline-width': 2,
                        'text-outline-color': '#fff'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 3,
                        'line-color': '#999',
                        'target-arrow-color': '#999',
                        'curve-style': 'bezier',
                        'opacity': 0.7
                    }
                },
                {
                    selector: 'node:selected',
                    style: {
                        'border-width': 3,
                        'border-color': '#333'
                    }
                }
            ],
            layout: {
                name: 'cose',
                animate: true,
                animationDuration: 1000,
                nodeOverlap: 20,
                idealEdgeLength: 100,
                edgeElasticity: 100,
                nestingFactor: 1.2,
                gravity: 80,
                numIter: 1000,
                initialTemp: 200,
                coolingFactor: 0.95,
                minTemp: 1.0
            },
            wheelSensitivity: 0.2
        });
        
        // 点击顶点显示详细信息
        cy.on('tap', 'node', function(evt) {
            const node = evt.target;
            const data = node.data();
            alert(`顶点信息：\n\nID: ${data.id}\n姓名: ${data.label}\n职业: ${data.job}\n年龄: ${data.age}\n社区: ${data.community}`);
        });
    </script>
</body>
</html>
